<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon Hotspot Viewer</title>
<meta name="description" content="See embodied-carbon hotspots in a Revit model: IFC geometry colored by Tally / C.Scale results, green for stored carbon, red for emissions.">
<link rel="stylesheet" href="src/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="brand">
      <h1>Carbon Hotspot Viewer</h1>
      <p class="sub">Revit model × Tally results</p>
    </header>

    <section class="block">
      <div class="loaders">
        <label class="btn">
          <input type="file" id="ifcInput" accept=".ifc" hidden>
          <span class="btn-title">Load model</span><span class="btn-hint">.ifc from Revit</span>
        </label>
        <label class="btn">
          <input type="file" id="dataInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm" hidden>
          <span class="btn-title">Load results</span><span class="btn-hint">Tally .csv / .xlsx</span>
        </label>
      </div>
      <div id="sources" class="sources"></div>
      <button id="demoBtn" class="link">Reset to demo building</button>
    </section>

    <section class="block" id="summary"></section>
    <section class="block ecard" id="elCard" hidden></section>

    <section class="block">
      <h2>Section cut</h2>
      <label class="range">Height: <b id="cutVal">off</b>
        <input type="range" id="cutRange" min="2" max="100" step="1" value="100">
      </label>
    </section>

    <section class="block grow">
      <h2>Types</h2>
      <div id="typeList" class="types"></div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="viewport"></canvas>
    <button id="settingsBtn" class="fab" aria-haspopup="dialog" aria-controls="settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></button>
    <div id="legend"></div>
    <div id="status" hidden></div>
    <div id="dropHint" hidden><div>Drop an <b>.ifc</b> model or a Tally <b>.csv / .xlsx</b></div></div>
    <div id="card" class="ecard" hidden></div>
  </main>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="sheet">
    <header class="sheet-hd">
      <h2 id="settingsTitle">Settings</h2>
      <button class="close" id="settingsClose" aria-label="Close settings">×</button>
    </header>
    <section class="block">
      <h2>Color by</h2>
      <div class="seg" id="metricSeg" role="radiogroup">
        <button data-metric="absolute" class="on">Total</button>
        <button data-metric="area">per m²</button>
        <button data-metric="volume">per m³</button>
      </div>
      <p class="note" id="metricNote"></p>

      <h2>Life-cycle stages</h2>
      <div id="stageChips" class="chips"></div>
      <label class="check"><input type="checkbox" id="bioToggle" checked> Include biogenic storage</label>

      <h2>Scale</h2>
      <label class="range">Clip outliers: <b id="clipVal">95th percentile</b>
        <input type="range" id="clipRange" min="75" max="100" step="1" value="95">
      </label>
      <label class="check"><input type="checkbox" id="sharedToggle"> Same scale for storage and emissions</label>
    </section>
    <section class="block">
      <h2>Matching &amp; columns</h2>
      <div id="diagBody"></div>
    </section>
  </div>
</dialog>
<script type="module" src="src/main.js"></script>
</body>
</html>
