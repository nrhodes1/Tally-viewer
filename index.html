<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embodied Carbon Viewer</title>
<meta name="description" content="See embodied-carbon hotspots in a Revit model: IFC geometry colored by Tally / C.Scale results, green for stored carbon, red for emissions.">
<link rel="stylesheet" href="src/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="brand">
      <h1>Embodied Carbon Viewer</h1>
      <p class="sub" id="version"></p>
    </header>

    <details class="block fold" id="modelData">
      <summary>
        <span class="md-ttl">Model data</span>
        <span class="md-sum" id="mdSum"></span>
        <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="zones">
        <label class="zone" id="ifcZone">
          <input type="file" id="ifcInput" accept=".ifc" hidden>
          <span class="z-k">Revit model</span>
          <span class="z-file" id="ifcFile"></span>
          <span class="z-meta" id="ifcMeta"></span>
          <span class="z-cta" id="ifcCta">Click or drop an .ifc file</span>
        </label>
        <label class="zone" id="dataZone">
          <input type="file" id="dataInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm" hidden>
          <span class="z-k">Tally results</span>
          <span class="z-file" id="dataFile"></span>
          <span class="z-meta" id="dataMeta"></span>
          <span class="z-cta">Click or drop a .csv or .xlsx file</span>
        </label>
      </div>
      <button id="demoBtn" class="link">Reset to demo</button>
    </details>

    <details class="block fold" id="scenarioBlock" open hidden>
      <summary>
        <span class="md-ttl">Scenario</span>
        <span class="md-sum" id="scenarioSum"></span>
        <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <label for="scenarioSel" class="sr-only">Scenario</label>
      <select id="scenarioSel" class="select"></select>
    </details>
    <details class="block fold" id="summary" open>
      <summary>
        <span class="md-ttl">Summary</span>
        <span class="md-sum" id="summarySum"></span>
        <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div id="summaryBody"></div>
    </details>
    <section class="block ecard" id="elCard" hidden></section>

    <details class="block fold" id="cutBlock" open>
      <summary>
        <span class="md-ttl">Section cut</span>
        <span class="md-sum" id="cutSum"></span>
        <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <label class="range">Height: <b id="cutVal">off</b>
        <input type="range" id="cutRange" min="2" max="100" step="1" value="100">
      </label>
    </details>

    <details class="block fold grow" id="typesBlock" open>
      <summary>
        <span class="md-ttl">Types</span>
        <span class="md-sum" id="typesSum"></span>
        <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div id="typeList" class="types"></div>
    </details>
  </aside>

  <main id="stage">
    <canvas id="viewport"></canvas>
    <button id="settingsBtn" class="fab" aria-haspopup="dialog" aria-controls="settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></button>
    <div id="legend"></div>
    <div id="status" hidden></div>
    <div id="dropHint" hidden><div>Drop an <b>.ifc</b> model or a Tally <b>.csv / .xlsx</b></div></div>
    <div id="card" class="ecard" hidden></div>
  </main>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="sheet">
    <header class="sheet-hd">
      <h2 id="settingsTitle">Settings</h2>
      <button class="close" id="settingsClose" aria-label="Close settings">×</button>
    </header>
    <section class="block">
      <h2>Color by</h2>
      <div class="seg" id="metricSeg" role="radiogroup">
        <button data-metric="absolute" class="on">Total</button>
        <button data-metric="area">per m²</button>
        <button data-metric="volume">per m³</button>
      </div>
      <p class="note" id="metricNote"></p>

      <h2>Life-cycle stages</h2>
      <div id="stageChips" class="chips"></div>
      <label class="check"><input type="checkbox" id="bioToggle" checked> Include biogenic storage</label>

      <h2>Scale</h2>
      <label class="range">Clip outliers: <b id="clipVal">95th percentile</b>
        <input type="range" id="clipRange" min="75" max="100" step="1" value="95">
      </label>
      <label class="check"><input type="checkbox" id="sharedToggle"> Same scale for storage and emissions</label>
    </section>
    <section class="block">
      <h2>Matching &amp; columns</h2>
      <div id="diagBody"></div>
    </section>
  </div>
</dialog>
<script type="module" src="src/main.js"></script>
</body>
</html>
